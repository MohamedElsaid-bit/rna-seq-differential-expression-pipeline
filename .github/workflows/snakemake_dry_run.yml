name: Snakemake Dry Run

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: "3.10"
          activate-environment: snakemake
          channels: conda-forge,bioconda

      - name: Install Snakemake
        shell: bash -l {0}
        run: |
          conda install -c conda-forge -c bioconda snakemake=7.32 pandas=2.0 --yes

      - name: Create empty placeholder inputs for the dry run
        run: |
          # The dry run only checks that the workflow graph resolves, so empty
          # files stand in for the reads and reference listed in the config.
          mkdir -p data/raw data/genome
          touch data/genome/hg38_subset.fa data/genome/gencode.v44.subset.gtf
          tail -n +2 config/samples.tsv | cut -f5,6 | tr '\t' '\n' | while read -r f; do touch "$f"; done

      - name: Run Snakemake dry run
        shell: bash -l {0}
        run: |
          snakemake --dry-run --cores 1 --use-conda --conda-frontend conda
